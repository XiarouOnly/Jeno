<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeno</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            height: 100vh; margin: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* HEADER */
        .chat-header { background: rgba(0,0,0,0.3); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title { font-weight: 800; font-size: 1.2rem; }

        /* AREA CHAT */
        #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
        .msg-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
        
        .msg { padding: 10px 16px; font-size: 0.95rem; font-weight: 500; cursor: pointer; position: relative; }
        .msg-wrapper.other .msg { background: #fff; color: #000; border-radius: 18px 18px 18px 4px; }
        .msg-wrapper.me .msg { background: #6366f1; color: #fff; border-radius: 18px 18px 4px 18px; }
        .msg-info { font-size: 0.65rem; opacity: 0.7; align-self: flex-end; margin-top: 2px; }

        /* FAKE LOGIN (FAN PAGE STYLE) */
        .box { padding: 30px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-radius: 20px; text-align: center; width: 85%; border: 1px solid rgba(255,255,255,0.1); }
        .box img { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 15px; border: 3px solid #fff; object-fit: cover; }
        .box h3 { color: #fff; margin-bottom: 15px; }
        input[type="password"] { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; text-align: center; }

        /* FLOATING LOVE ANIMATION */
        .heart { position: fixed; font-size: 25px; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100vh); } }

        /* INPUT & BUTTON */
        .input-popup { position: fixed; bottom: 80px; left: 15px; right: 15px; background: #18181b; padding: 10px; border-radius: 30px; display: flex; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100; }
        .input-popup input { flex: 1; background: transparent; border: none; color: #fff; padding: 5px 10px; outline: none; }
        .quick-btn { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #6366f1; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; z-index: 99; font-size: 1.5rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="password-box" class="box">
        <img src="https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg" alt="Jeno">
        <h3>Jeno Lee</h3>
        <form onsubmit="event.preventDefault(); checkPw();">
            <input type="password" id="pw" placeholder="Enter key..." enterkeyhint="go">
        </form>
    </div>

    <div id="chat-box" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
        <div class="chat-header">
            <span class="header-title">Jeno</span>
            <span class="online-count">👁️ <span id="online-count">1</span></span>
        </div>
        <div id="messages"></div>
        <div id="input-popup" class="input-popup hidden">
            <form id="chat-form" style="display:flex; width:100%;">
                <input type="text" id="msg" placeholder="Ketik..." autocomplete="off">
                <button type="submit" style="background:#6366f1; border:none; color:white; border-radius:20px; padding:0 15px;">➤</button>
            </form>
        </div>
        <div class="quick-btn" onclick="toggleInput()">💬</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4D6MZ25iU1Ql9lKYyhW8x_Uni03mxyIA",
        authDomain: "jeno-41a37.firebaseapp.com",
        databaseURL: "https://jeno-41a37-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jeno-41a37",
        storageBucket: "jeno-41a37.firebasestorage.app",
        messagingSenderId: "183074678018",
        appId: "1:183074678018:web:9e49ad568c9b488b7ace1b",
        measurementId: "G-F09DRMWCSL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    if(!localStorage.getItem('my_id')) localStorage.setItem('my_id', Math.random().toString(36).substr(2, 9));
    const myId = localStorage.getItem('my_id');

    window.checkPw = function() {
        if(document.getElementById('pw').value === 'y') {
            document.getElementById('password-box').classList.add('hidden');
            document.getElementById('chat-box').classList.remove('hidden');
            set(ref(db, 'presence/' + myId), true);
            onValue(ref(db, 'presence'), (s) => document.getElementById('online-count').innerText = s.val() ? Object.keys(s.val()).length : 1);
            onChildAdded(chatRef, (s) => appendMessage(s.key, s.val()));
        } else {
            const pw = document.getElementById('pw');
            pw.value = ''; pw.style.borderColor = 'red';
            setTimeout(() => pw.style.borderColor = 'rgba(255,255,255,0.2)', 500);
        }
    };

    window.toggleInput = () => { document.getElementById('input-popup').classList.toggle('hidden'); document.getElementById('msg').focus(); };

    // Floating Love Logic
    const createHeart = (x, y) => {
        const h = document.createElement('div');
        h.className = 'heart'; h.innerHTML = '❤️';
        h.style.left = x + 'px'; h.style.top = y + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1500);
    };

    document.getElementById('messages').addEventListener('dblclick', (e) => {
        if(e.target.closest('.msg')) createHeart(e.clientX, e.clientY);
    });

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value.trim()) return;
        push(chatRef, { sender: myId, text: input.value.trim(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        input.value = '';
        document.getElementById('input-popup').classList.add('hidden');
    };

    function appendMessage(id, data) {
        const container = document.getElementById('messages');
        const isMe = data.sender === myId;
        container.innerHTML += `
            <div class="msg-wrapper ${isMe ? 'me' : 'other'}">
                <div class="msg" ondblclick="createHeart(event.clientX, event.clientY)">
                    <div>${data.text}</div>
                    <div class="msg-info">${data.time}</div>
                </div>
            </div>`;
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
