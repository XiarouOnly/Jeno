<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4D6MZ25iU1Ql9lKYyhW8x_Uni03mxyIA",
        authDomain: "jeno-41a37.firebaseapp.com",
        databaseURL: "https://jeno-41a37-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jeno-41a37",
        storageBucket: "jeno-41a37.firebasestorage.app",
        messagingSenderId: "183074678018",
        appId: "1:183074678018:web:9e49ad568c9b488b7ace1b",
        measurementId: "G-F09DRMWCSL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    if(!localStorage.getItem('my_id')) localStorage.setItem('my_id', Math.random().toString(36).substr(2, 9));
    const myId = localStorage.getItem('my_id');

    window.checkPw = () => { if(document.getElementById('pw').value === 'y') { document.getElementById('gallery-box').classList.add('hidden'); document.getElementById('chat-box').classList.remove('hidden'); } else { document.getElementById('pw').value = ''; } };
    window.panicMode = () => { document.getElementById('chat-box').classList.add('hidden'); document.getElementById('gallery-box').classList.remove('hidden'); document.getElementById('input-popup').classList.add('hidden'); };
    window.toggleInput = () => { document.getElementById('input-popup').classList.toggle('hidden'); document.getElementById('msg').focus(); };

    window.sendReaction = (emoji) => push(chatRef, { sender: myId, type: 'reaction', emoji: emoji });

    window.showEmoji = (emoji) => {
        for(let i=0; i<5; i++) {
            const el = document.createElement('div');
            el.className = 'emoji-float'; el.innerHTML = emoji;
            el.style.left = (Math.random() * 80 + 10) + '%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }
    };

    onChildAdded(chatRef, (s) => {
        const data = s.val();
        // CEK APAKAH USER LAGI DI CHAT BOX
        const isChatActive = !document.getElementById('chat-box').classList.contains('hidden');

        if(data.type === 'reaction') {
            if(isChatActive) {
                showEmoji(data.emoji);
            }
        } else {
            const container = document.getElementById('messages');
            container.innerHTML += `
                <div class="msg-wrapper ${data.sender === myId ? 'me' : 'other'}">
                    <div class="msg">
                        <div>${data.text}</div>
                        <div class="msg-info">${data.time}</div>
                    </div>
                </div>`;
            container.scrollTop = container.scrollHeight;
        }
    });

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value.trim()) return;
        push(chatRef, { sender: myId, text: input.value.trim(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        input.value = '';
        document.getElementById('input-popup').classList.add('hidden');
    };
</script>
