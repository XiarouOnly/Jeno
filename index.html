<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeno</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { height: 100vh; margin: 0; background: #09090b; color: #fff; overflow: hidden; }
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; margin: auto; }
        
        /* GALERI FOTO (DISGUISE) */
        #gallery-box { height: 100vh; overflow-y: auto; padding: 16px; background: #09090b; }
        .gallery-header { padding: 10px 0 20px 0; }
        .gallery-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; }
        .search-disguise { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 12px; color: #fff; text-align: center; outline: none; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gallery-item { border-radius: 16px; overflow: hidden; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; }

        /* CHAT BOX */
        #chat-box { flex: 1; display: flex; flex-direction: column; height: 100vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg'); background-size: cover; background-position: center; }
        .chat-header { background: rgba(0,0,0,0.4); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .emergency-btn { cursor: pointer; font-size: 1.2rem; margin-right: 10px; }
        
        #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
        .msg-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 10px 16px; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
        .msg-wrapper.other .msg { background: #fff; color: #000; border-radius: 18px 18px 18px 4px; }
        .msg-wrapper.me .msg { background: #6366f1; color: #fff; border-radius: 18px 18px 4px 18px; }
        .msg-info { font-size: 0.65rem; opacity: 0.7; }

        .input-popup { position: fixed; bottom: 80px; left: 15px; right: 15px; background: #18181b; padding: 10px; border-radius: 30px; display: flex; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        .input-popup input { flex: 1; background: transparent; border: none; color: #fff; padding: 5px 10px; outline: none; }
        .quick-btn { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #6366f1; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; z-index: 99; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        
        .hidden { display: none !important; }
        .heart { position: fixed; font-size: 25px; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100vh); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="gallery-box">
        <div class="gallery-header">
            <span class="gallery-title">Jeno Archive</span>
            <form onsubmit="event.preventDefault(); checkPw();">
                <input type="password" id="pw" class="search-disguise" placeholder="Cari foto..." enterkeyhint="go">
            </form>
        </div>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg"></div>
            <div class="gallery-item"><img src="https://i.pinimg.com/736x/8e/31/3d/8e313d33934d402fa6a715f5a2b16853.jpg"></div>
            <div class="gallery-item"><img src="https://i.pinimg.com/564x/2b/42/70/2b4270f907fa8bbf9d7a22e2bb4a806c.jpg"></div>
            <div class="gallery-item"><img src="https://i.pinimg.com/564x/5b/18/76/5b1876a382c78a05f1f7ef69d7249a5b.jpg"></div>
        </div>
    </div>

    <div id="chat-box" class="hidden">
        <div class="chat-header">
            <div>
                <span class="emergency-btn" onclick="panicMode()">⚠️</span>
                <span class="header-title">Jeno</span>
            </div>
            <span class="online-count">👁️ <span id="online-count">1</span></span>
        </div>
        <div id="messages"></div>
        <div id="input-popup" class="input-popup hidden">
            <form id="chat-form" style="display:flex; width:100%;">
                <input type="text" id="msg" placeholder="Ketik pesan..." autocomplete="off">
                <button type="submit" style="background:#6366f1; border:none; color:white; border-radius:20px; padding:0 15px;">➤</button>
            </form>
        </div>
        <div class="quick-btn" onclick="toggleInput()">💬</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4D6MZ25iU1Ql9lKYyhW8x_Uni03mxyIA",
        authDomain: "jeno-41a37.firebaseapp.com",
        databaseURL: "https://jeno-41a37-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jeno-41a37",
        storageBucket: "jeno-41a37.firebasestorage.app",
        messagingSenderId: "183074678018",
        appId: "1:183074678018:web:9e49ad568c9b488b7ace1b",
        measurementId: "G-F09DRMWCSL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    if(!localStorage.getItem('my_id')) localStorage.setItem('my_id', Math.random().toString(36).substr(2, 9));
    const myId = localStorage.getItem('my_id');

    window.checkPw = () => {
        if(document.getElementById('pw').value === 'y') {
            document.getElementById('gallery-box').classList.add('hidden');
            document.getElementById('chat-box').classList.remove('hidden');
        } else { document.getElementById('pw').value = ''; }
    };

    window.panicMode = () => {
        document.getElementById('chat-box').classList.add('hidden');
        document.getElementById('gallery-box').classList.remove('hidden');
        document.getElementById('msg').value = '';
    };

    window.toggleInput = () => { document.getElementById('input-popup').classList.toggle('hidden'); document.getElementById('msg').focus(); };

    // ... (Firebase listeners setup same as before) ...
    // Note: I simplified the listeners here, make sure your Firebase setup remains consistent!
    set(ref(db, 'presence/' + myId), true);
    onDisconnect(ref(db, 'presence/' + myId)).remove();
    onValue(ref(db, 'presence'), (s) => document.getElementById('online-count').innerText = s.val() ? Object.keys(s.val()).length : 1);
    onChildAdded(chatRef, (s) => appendMessage(s.key, s.val()));

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value.trim()) return;
        push(chatRef, { sender: myId, text: input.value.trim(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        input.value = '';
        document.getElementById('input-popup').classList.add('hidden');
    };

    function appendMessage(id, data) {
        const container = document.getElementById('messages');
        container.innerHTML += `
            <div class="msg-wrapper ${data.sender === myId ? 'me' : 'other'}">
                <div class="msg" ondblclick="createHeart(event.clientX, event.clientY)">
                    <div>${data.text}</div>
                    <div class="msg-info">${data.time}</div>
                </div>
            </div>`;
        container.scrollTop = container.scrollHeight;
    }

    window.createHeart = (x, y) => {
        const h = document.createElement('div');
        h.className = 'heart'; h.innerHTML = '❤️';
        h.style.left = x + 'px'; h.style.top = y + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1500);
    };
</script>
</body>
</html>
