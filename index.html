<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeno</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { height: 100vh; margin: 0; background: #09090b; color: #fff; overflow: hidden; }
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; margin: auto; }
        
        /* GALERI FOTO */
        #gallery-box { height: 100vh; overflow-y: auto; padding: 16px; background: #09090b; }
        .gallery-header { padding: 10px 0 20px 0; }
        .gallery-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; }
        .search-disguise { width: 100%; background: rgba(255,255,255,0.07); border: none; border-radius: 20px; padding: 12px; color: #fff; text-align: center; outline: none; margin-bottom: 20px; font-size: 0.9rem;}
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gallery-item { border-radius: 16px; overflow: hidden; background: #18181b; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; }

        /* CHAT BOX */
        #chat-box { flex: 1; display: flex; flex-direction: column; height: 100vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg'); background-size: cover; background-position: center; }
        .chat-header { background: rgba(0,0,0,0.4); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title { font-weight: 800; font-size: 1.2rem; }
        
        #messages { flex: 1; padding: 16px 16px 120px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
        .msg-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 10px 16px; font-size: 0.95rem; font-weight: 500; }
        .msg-wrapper.other .msg { background: #fff; color: #000; border-radius: 18px 18px 18px 4px; }
        .msg-wrapper.me .msg { background: #6366f1; color: #fff; border-radius: 18px 18px 4px 18px; }

        /* INPUT POPUP - FIX POSISI */
        .input-popup { position: fixed; bottom: 80px; left: 15px; right: 15px; background: #18181b; padding: 12px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Reaction Bar */
        .reaction-bar { display: flex; justify-content: space-around; padding-bottom: 5px; cursor: pointer; font-size: 1.4rem; }
        
        .input-wrapper { display: flex; gap: 10px; width: 100%; }
        .input-wrapper input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 20px; outline: none; }
        
        .quick-btn { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #6366f1; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; z-index: 99; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); cursor: pointer; }
        
        .hidden { display: none !important; }
        .emoji-float { position: fixed; font-size: 35px; pointer-events: none; animation: floatUp 2s ease-out forwards; z-index: 2000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100vh); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="gallery-box">
        <div class="gallery-header">
            <span class="gallery-title">Jeno Wallpaper HD</span>
            <form onsubmit="event.preventDefault(); checkPw();">
                <input type="password" id="pw" class="search-disguise" placeholder="Search..." enterkeyhint="go">
            </form>
        </div>
        <div class="gallery-grid" id="photo-grid">
            <script>
                const imgs = ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwAq_65nOwL-USREFZeHngphe9NnHx3zQbBH2LtfTzew&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjalF-HLqxpDR2Qc6SKq8ZSGj18OSQzBLrR3wNCm7D_g&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpPTcP0kghReb6o73Z6SJ8x1jXkrCj4-Y9n6ic_b_zww&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRGnosczqfmu2NnLIUi-X2ESlYnLidxF-o-9E4KUlnAw&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX5OlvCvIJoA7iXiClsS3MeZFHh6c1I3gVxmb6AQI5HbRyZRqTy8gjan4n&s=10"];
                for(let i=0; i<20; i++) document.write(`<div class="gallery-item"><img src="${imgs[i % 5]}"></div>`);
            </script>
        </div>
    </div>

    <div id="chat-box" class="hidden">
        <div class="chat-header">
            <div><span style="cursor:pointer; margin-right:10px" onclick="panicMode()">⚠️</span><span class="header-title">Jeno</span></div>
            <span id="online-count">👁️ 1</span>
        </div>
        <div id="messages"></div>
        
        <div id="input-popup" class="input-popup hidden">
            <!-- Reaction Bar Tambahan -->
            <div class="reaction-bar">
                <span onclick="sendReaction('😂')">😂</span>
                <span onclick="sendReaction('😭')">😭</span>
                <span onclick="sendReaction('🥰')">🥰</span>
            </div>
            <!-- Tombol Kirim Tetap Sama -->
            <form id="chat-form" class="input-wrapper">
                <input type="text" id="msg" placeholder="Ketik pesan..." autocomplete="off">
                <button type="submit" style="background:#6366f1; border:none; color:white; border-radius:20px; padding:0 15px; font-weight:bold;">➤</button>
            </form>
        </div>
        <div class="quick-btn" onclick="toggleInput()">💬</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4D6MZ25iU1Ql9lKYyhW8x_Uni03mxyIA",
        authDomain: "jeno-41a37.firebaseapp.com",
        databaseURL: "https://jeno-41a37-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jeno-41a37",
        storageBucket: "jeno-41a37.firebasestorage.app",
        messagingSenderId: "183074678018",
        appId: "1:183074678018:web:9e49ad568c9b488b7ace1b",
        measurementId: "G-F09DRMWCSL"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    const chatRef = ref(db, 'chats');
    const myId = localStorage.getItem('my_id') || (localStorage.setItem('my_id', Math.random().toString(36).substr(2, 9)) || localStorage.getItem('my_id'));

    window.checkPw = () => { if(document.getElementById('pw').value === 'y') { document.getElementById('gallery-box').classList.add('hidden'); document.getElementById('chat-box').classList.remove('hidden'); } else { document.getElementById('pw').value = ''; } };
    window.panicMode = () => { document.getElementById('chat-box').classList.add('hidden'); document.getElementById('gallery-box').classList.remove('hidden'); };
    window.toggleInput = () => { document.getElementById('input-popup').classList.toggle('hidden'); document.getElementById('msg').focus(); };

    window.sendReaction = (emoji) => push(chatRef, { sender: myId, type: 'reaction', emoji: emoji });

    window.showEmoji = (emoji) => {
        for(let i=0; i<5; i++) {
            const el = document.createElement('div');
            el.className = 'emoji-float'; el.innerHTML = emoji;
            el.style.left = (Math.random() * 80 + 10) + '%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }
    };

    onChildAdded(chatRef, (s) => {
        const data = s.val();
        if(data.type === 'reaction') { showEmoji(data.emoji); } 
        else {
            const container = document.getElementById('messages');
            container.innerHTML += `<div class="msg-wrapper ${data.sender === myId ? 'me' : 'other'}"><div class="msg"><div>${data.text}</div></div></div>`;
            container.scrollTop = container.scrollHeight;
        }
    });

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value.trim()) return;
        push(chatRef, { sender: myId, text: input.value.trim() });
        input.value = '';
    };
</script>
</body>
</html>
