<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeno</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            height: 100vh; margin: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* Header */
        .chat-header { background: rgba(0,0,0,0.4); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title { font-weight: 800; font-size: 1.2rem; }
        .online-count { font-size: 0.9rem; color: #10b981; font-weight: 700; }

        /* Area Pesan */
        #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 150px; }

        /* Balon Chat 2 Arah */
        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
        .msg-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 8px 14px; font-size: 0.95rem; font-weight: 500; display: flex; flex-direction: column; gap: 2px; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; align-self: flex-end; }
        .msg-wrapper.other .msg { background: #fff; color: #000; border-radius: 18px 18px 18px 4px; }
        .msg-wrapper.me .msg { background: #6366f1; color: #fff; border-radius: 18px 18px 4px 18px; }

        /* Stealth Login */
        .box { padding: 40px 25px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 20px; text-align: center; width: 85%; }
        input[type="password"] { width: 100%; padding: 14px; background: rgba(255,255,255,0.1); border: none; border-radius: 15px; color: #fff; text-align: center; }

        /* Input Bar (Dinaikkan tinggi biar gak kena nav bar) */
        .input-wrapper { position: fixed; bottom: 80px; left: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 30px; display: flex; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        #chat-form input { flex: 1; background: transparent; border: none; color: #fff; padding: 5px 10px; outline: none; }
        
        /* Floating Button Pintasan */
        .quick-btn { position: fixed; bottom: 150px; right: 20px; width: 45px; height: 45px; background: #6366f1; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .typing { color: #fff; font-size: 0.8rem; font-style: italic; margin-left: 20px; margin-bottom: 5px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="password-box" class="box">
        <form onsubmit="event.preventDefault(); checkPw();">
            <input type="password" id="pw" placeholder="Jeno?" enterkeyhint="go">
        </form>
    </div>

    <div id="chat-box" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
        <div class="chat-header">
            <span class="header-title">Jeno</span>
            <span class="online-count">👁️ <span id="online-count">1</span></span>
        </div>
        <div id="messages"></div>
        <div id="typing" class="typing hidden">...</div>
        <div class="input-wrapper">
            <form id="chat-form">
                <input type="text" id="msg" placeholder="Ketik..." autocomplete="off">
                <button type="submit" style="background:#6366f1; border:none; color:white; border-radius:20px; padding:0 15px;">➤</button>
            </form>
        </div>
        <div class="quick-btn" onclick="document.getElementById('msg').focus()">💬</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4D6MZ25iU1Ql9lKYyhW8x_Uni03mxyIA",
        authDomain: "jeno-41a37.firebaseapp.com",
        databaseURL: "https://jeno-41a37-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jeno-41a37",
        storageBucket: "jeno-41a37.firebasestorage.app",
        messagingSenderId: "183074678018",
        appId: "1:183074678018:web:9e49ad568c9b488b7ace1b",
        measurementId: "G-F09DRMWCSL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    // Penanda identitas HP (acak, tapi stabil)
    if(!localStorage.getItem('my_id')) localStorage.setItem('my_id', Math.random().toString(36).substr(2, 9));
    const myId = localStorage.getItem('my_id');

    window.checkPw = function() {
        if(document.getElementById('pw').value === 'y') {
            document.getElementById('password-box').classList.add('hidden');
            document.getElementById('chat-box').classList.remove('hidden');
            set(ref(db, 'presence/' + myId), true);
            onDisconnect(ref(db, 'presence/' + myId)).remove();
            onValue(ref(db, 'presence'), (s) => document.getElementById('online-count').innerText = s.val() ? Object.keys(s.val()).length : 1);
            onChildAdded(chatRef, (s) => appendMessage(s.val()));
            onValue(ref(db, 'typing'), (s) => { const d = s.val(); document.getElementById('typing').classList.toggle('hidden', !(d && d.isTyping && d.sender !== myId)); });
        }
    };

    document.getElementById('msg').addEventListener('input', () => {
        set(ref(db, 'typing'), { sender: myId, isTyping: true });
        clearTimeout(window.t);
        window.t = setTimeout(() => set(ref(db, 'typing'), { sender: myId, isTyping: false }), 2000);
    });

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value.trim()) return;
        push(chatRef, { sender: myId, text: input.value.trim(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        set(ref(db, 'typing'), { isTyping: false });
        input.value = '';
    };

    function appendMessage(data) {
        const container = document.getElementById('messages');
        container.innerHTML += `
            <div class="msg-wrapper ${data.sender === myId ? 'me' : 'other'}">
                <div class="msg">
                    <div>${data.text}</div>
                    <span class="msg-time">${data.time}</span>
                </div>
            </div>`;
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
