<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeno</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            height: 100vh; margin: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://i.pinimg.com/736x/50/cd/3f/50cd3fa03507dc3d684e58254262b5ab.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        .chat-header { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title { font-weight: 800; font-size: 1.2rem; }
        .online-count { font-size: 0.9rem; color: #10b981; font-weight: 700; }

        #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
        .msg-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
        
        .msg { padding: 10px 16px; font-size: 0.95rem; font-weight: 500; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .msg-wrapper.other .msg { background: #fff; color: #000; border-radius: 18px 18px 18px 4px; }
        .msg-wrapper.me .msg { background: #6366f1; color: #fff; border-radius: 18px 18px 4px 18px; }

        /* Stealth Box */
        .box { padding: 40px 25px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 80%; }
        .box p { color: #fff; margin-bottom: 10px; font-weight: 600; }
        input[type="password"] { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        
        /* Shake Animation kalau password salah */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s linear; }

        .input-wrapper { position: absolute; bottom: 30px; left: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px; border-radius: 30px; display: flex; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        #chat-form input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; outline: none; }
        #chat-form button { background: #6366f1; border: none; color: #fff; padding: 0 20px; border-radius: 20px; font-weight: 700; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="password-box" class="box">
        <p>Jeno?</p>
        <form onsubmit="event.preventDefault(); checkPw();">
            <input type="password" id="pw" placeholder="Enter password" enterkeyhint="go">
        </form>
    </div>

    <div id="chat-box" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
        <div class="chat-header">
            <span class="header-title">Jeno</span>
            <span class="online-count">👁️ <span id="online-count">1</span></span>
        </div>
        <div id="messages"></div>
        <div class="input-wrapper">
            <form id="chat-form">
                <input type="text" id="msg" placeholder="Ketik pesan..." autocomplete="off">
                <button type="submit">➤</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4D6MZ25iU1Ql9lKYyhW8x_Uni03mxyIA",
        authDomain: "jeno-41a37.firebaseapp.com",
        databaseURL: "https://jeno-41a37-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jeno-41a37",
        storageBucket: "jeno-41a37.firebasestorage.app",
        messagingSenderId: "183074678018",
        appId: "1:183074678018:web:9e49ad568c9b488b7ace1b",
        measurementId: "G-F09DRMWCSL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    window.checkPw = function() {
        const input = document.getElementById('pw');
        if(input.value === 'y') {
            document.getElementById('password-box').classList.add('hidden');
            document.getElementById('chat-box').classList.remove('hidden');
            
            const myId = 'user_' + Math.random().toString(36).substr(2, 4);
            set(ref(db, 'presence/' + myId), true);
            onDisconnect(ref(db, 'presence/' + myId)).remove();

            onValue(ref(db, 'presence'), (s) => document.getElementById('online-count').innerText = s.val() ? Object.keys(s.val()).length : 1);
            onChildAdded(chatRef, (s) => appendMessage(s.val()));
        } else { 
            // Stealth Feedback
            input.value = '';
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 200);
        }
    };

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value.trim()) return;
        push(chatRef, { text: input.value.trim(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        input.value = '';
    };

    function appendMessage(data) {
        const container = document.getElementById('messages');
        container.innerHTML += `<div class="msg-wrapper other"><div class="msg"><div>${data.text}</div></div></div>`;
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
